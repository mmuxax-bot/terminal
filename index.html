<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proqramlaşdırma Layihələri</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        h1 {
            font-size: 2.2rem;
            margin-bottom: 30px;
            text-align: center;
            letter-spacing: 1px;
        }
        .qovluq-konteyner {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 350px;
        }
        .qovluq-duymesi {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-decoration: none;
            padding: 18px 20px;
            border-radius: 12px;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        /* Python */
        .python-btn { background: linear-gradient(135deg, #3776AB, #FFD43B); color: #121212; }
        /* HTML/CSS */
        .html-btn { background: linear-gradient(135deg, #E34F26, #264de4); color: white; }
        /* JS */
        .js-btn { background: linear-gradient(135deg, #F7DF1E, #000000); color: #ffffff; text-shadow: 1px 1px 2px rgba(0,0,0,0.8); }
        /* SQL */
        .sql-btn { background: linear-gradient(135deg, #003B57, #336791); color: white; }
        /* C */
        .c-btn { background: linear-gradient(135deg, #283593, #1976D2); color: white; }

        .qovluq-duymesi:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(255,255,255,0.1);
        }
    </style>
</head>
<body>

    <h1>Layihələrim</h1>
    
    <div class="qovluq-konteyner">
        <a href="t1/" class="qovluq-duymesi python-btn">🐍 Python</a>
        <a href="t2/" class="qovluq-duymesi html-btn">🎨 HTML & CSS</a>
        <a href="t3/" class="qovluq-duymesi js-btn">⚡ JavaScript</a>
        <a href="t4/" class="qovluq-duymesi sql-btn">🗄️ SQL</a>
        <a href="t5/" class="qovluq-duymesi c-btn">⚙️ C</a>
    </div>

</body>
</html>
