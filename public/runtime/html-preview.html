<!doctype html>
<html lang="az">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HTML önizləmə</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #fff;
        color: #111;
        font-family: system-ui, sans-serif;
      }
      .empty {
        display: grid;
        place-items: center;
        min-height: 100vh;
        padding: 24px;
        color: #5d6d82;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <script>
      (function () {
        var html = null;
        try {
          html = sessionStorage.getItem("nibrascode.studio.html.preview");
        } catch (e) {}
        if (!html) {
          try {
            html = localStorage.getItem("nibrascode.studio.html.preview");
          } catch (e2) {}
        }
        if (!html) {
          document.body.innerHTML =
            '<p class="empty">Önizləmə tapılmadı. Studio-da <b>Başlat</b> düyməsinə basın.</p>';
          return;
        }
        document.open();
        document.write(html);
        document.close();
      })();
    </script>
  </body>
</html>
