<!doctype html>
<html lang="az"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self';script-src 'self';style-src 'self';worker-src 'self';connect-src 'self';img-src 'self' data:;object-src 'none';base-uri 'none';form-action 'none'">
<title>SQL Terminal | NibrasCode</title><link rel="stylesheet" href="styles.css"></head>
<body><main>
<header><a href="https://nibrascode.com">Nibras<span>Code</span>.com</a><div id="status" data-s="load"><i></i><em>SQLite yüklənir…</em></div></header>
<section>
 <div class="title"><b>SQL Terminal <em class="ver">V1</em></b><small>SQLite · təhlükəsiz rejim</small></div>
 <nav>
  <select id="samples" aria-label="Nümunələr"><option value="">Nümunələr…</option></select>
  <button id="copy">Kopyala</button><button id="dl" title="Bazanı .sqlite faylı kimi yüklə">.sqlite</button><button id="rst" title="Nümunə bazasını bərpa et">DB sıfırla</button><button id="clear">Təmizlə</button>
  <button id="run" disabled>▶ Başlat</button>
 </nav>
 <div class="editor"><pre id="lines">1</pre><div class="code"><pre id="hl" aria-hidden="true"></pre><textarea id="code" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off"></textarea></div></div>
 <details open><summary>Cədvəllər</summary><div id="tables"></div></details>
 <div class="bar"><b>Nəticə</b><span><span id="time">40 saniyə limit</span><button id="copyout">Kopyala</button></span></div>
 <pre id="output">Sorğunu yazıb ▶ Başlat basın (Ctrl+Enter). Mətn seçilibsə yalnız seçilmiş sorğu işləyir.</pre>
</section>
<footer><a href="https://nibrascode.com">Nibras<span>Code</span>.com</a></footer>
</main><script type="module" src="app.js?v=1"></script></body></html>
